<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14423f">
<meta name="description" content="中研院数位典藏系统·舆图目录检索（移动端）">
<title>中研院舆图检索</title>
<style>
  :root{
    --ink:#24312e; --sub:#6b7a75; --line:#e3ddd2;
    --bg:#f4efe5; --card:#ffffff; --main:#14423f; --main2:#1f5c56;
    --accent:#b7793f; --chip:#e9e1d2; --hdh:75px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); font-size:16px; line-height:1.5;
  }
  /* ---------- 顶部 ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:20;
    background:linear-gradient(135deg,var(--main),var(--main2));
    color:#fff; padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
  }
  .bar-title{font-size:17px;font-weight:700;letter-spacing:.5px;}
  .bar-title .badge{
    display:inline-block;font-size:11px;font-weight:400;background:rgba(255,255,255,.18);
    border-radius:20px;padding:1px 8px;margin-left:6px;vertical-align:2px;letter-spacing:0;
  }
  .crumbs{
    margin-top:6px;font-size:13px;color:#cfe0dd;display:flex;flex-wrap:wrap;gap:2px 0;
    overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .crumbs::-webkit-scrollbar{display:none;}
  .crumbs span{padding:2px 4px;border-radius:6px;}
  .crumbs .sep{color:#8fb3ae;padding:0 1px;}
  .crumbs .cur{color:#fff;font-weight:600;}
  .crumbs .link{color:#cfe0dd;}
  .crumbs .link:active{background:rgba(255,255,255,.2);}
  /* ---------- 主体 ---------- */
  main{padding:calc(var(--hdh) + 8px + env(safe-area-inset-top)) 12px calc(64px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto;}
  /* 统计条 */
  .stat{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;font-size:13px;color:var(--sub);margin-bottom:10px;
    display:flex;gap:14px;flex-wrap:wrap;
  }
  .stat b{color:var(--main);font-weight:700;}
  /* 卡片 */
  .folder-card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;
    box-shadow:0 1px 2px rgba(60,50,30,.05);
  }
  .folder-card:active{background:#f7f2e7;}
  .f-icon{
    width:42px;height:42px;border-radius:10px;flex-shrink:0;
    background:linear-gradient(135deg,#d9c9a6,#c9b78e);
    display:flex;align-items:center;justify-content:center;font-size:20px;color:#6b5427;
  }
  .f-main{flex:1;min-width:0;}
  .f-name{font-weight:600;font-size:15px;word-break:break-all;}
  .f-meta{font-size:12px;color:var(--sub);margin-top:2px;}
  .f-arrow{color:#c4b895;font-size:18px;flex-shrink:0;}
  /* 文件行 */
  .file-row{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px;
  }
  .file-row:active{background:#f7f2e7;}
  .file-row .f-icon{background:#eef2e4;color:#5a7340;font-size:18px;width:38px;height:38px;border-radius:9px;}
  .file-row .f-name{font-weight:500;font-size:14px;}
  .f-sub{font-size:12px;color:var(--sub);margin-top:2px;}
  .hl{background:#f3d9a8;border-radius:3px;padding:0 2px;}
  /* 加载更多 */
  .more{
    text-align:center;padding:10px;color:var(--main);font-size:14px;font-weight:600;
  }
  .more.tap{color:var(--accent);}
  /* 排序 chips */
  .chips{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .chip{
    border:1px solid var(--line);background:var(--chip);color:var(--sub);
    border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;
  }
  .chip.on{background:var(--main);color:#fff;border-color:var(--main);}
  /* ---------- 搜索 ---------- */
  .search-box{
    position:sticky;top:calc(var(--hdh) + 8px);z-index:10;background:var(--bg);padding:10px 0;
  }
  .search-box input{
    width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);
    padding:12px 14px;font-size:16px;color:var(--ink);outline:none;
    box-shadow:0 1px 3px rgba(60,50,30,.06);
  }
  .search-box input:focus{border-color:var(--main2);}
  .result-item{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;margin-bottom:6px;
  }
  .result-item:active{background:#f7f2e7;}
  .r-name{font-size:14px;font-weight:600;word-break:break-all;}
  .r-path{font-size:12px;color:var(--sub);margin-top:2px;word-break:break-all;}
  .r-meta{font-size:12px;color:var(--sub);margin-top:2px;}
  .r-count{font-size:13px;color:var(--sub);padding:4px 2px 10px;}
  .empty{padding:40px 10px;text-align:center;color:var(--sub);font-size:14px;}
  /* ---------- 底部 Tab ---------- */
  nav{
    position:fixed;bottom:0;left:0;right:0;z-index:20;
    background:#fff;border-top:1px solid var(--line);
    display:flex;padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    flex:1;border:none;background:none;padding:8px 0 6px;font-size:12px;color:var(--sub);
    display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px;
  }
  nav button .ic{font-size:20px;line-height:1;}
  nav button.on{color:var(--main);font-weight:700;}
  /* ---------- 详情弹层 ---------- */
  .mask{
    position:fixed;inset:0;background:rgba(20,30,28,.45);z-index:30;display:none;
  }
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:31;background:#fff;
    border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    max-width:680px;margin:0 auto;transform:translateY(100%);transition:transform .22s ease;
  }
  .sheet.show{transform:translateY(0);}
  .sheet h3{margin:0 0 10px;font-size:16px;word-break:break-all;}
  .sheet .kv{display:flex;gap:8px;font-size:14px;padding:5px 0;border-top:1px dashed var(--line);}
  .sheet .kv:first-of-type{border-top:none;}
  .sheet .kv .k{color:var(--sub);width:64px;flex-shrink:0;}
  .sheet .kv .v{flex:1;word-break:break-all;}
  .sheet .copy{
    margin-top:12px;width:100%;border:none;background:var(--main);color:#fff;
    border-radius:12px;padding:12px;font-size:15px;font-weight:600;
  }
  .sheet .copy:active{background:var(--main2);}
  .toast{
    position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:40;
    background:rgba(20,40,37,.92);color:#fff;font-size:13px;border-radius:20px;
    padding:8px 16px;display:none;
  }
</style>
</head>
<body>

<header>
  <div class="bar-title">中研院数位典藏<span class="badge">舆图目录检索</span></div>
  <div class="crumbs" id="crumbs"></div>
</header>

<main id="main"></main>

<nav id="tabbar">
  <button id="tab-browse" class="on" data-tab="browse"><span class="ic">🗂️</span>浏览</button>
  <button id="tab-search" data-tab="search"><span class="ic">🔍</span>检索</button>
</nav>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <h3 id="sh-name"></h3>
  <div class="kv"><span class="k">大小</span><span class="v" id="sh-size"></span></div>
  <div class="kv"><span class="k">日期</span><span class="v" id="sh-date"></span></div>
  <div class="kv"><span class="k">路径</span><span class="v" id="sh-path"></span></div>
  <button class="copy" id="sh-copy">复制文件名</button>
</div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
(function(){
"use strict";
var DATA = window.INDEX_DATA;
if(!DATA){ document.getElementById("main").innerHTML = '<div class="empty">数据加载失败：请确认 data.js 与页面在同一目录</div>'; return; }

var main = document.getElementById("main");
var crumbs = document.getElementById("crumbs");
var sheet = document.getElementById("sheet");
var mask = document.getElementById("mask");
var toast = document.getElementById("toast");
var PAGE = 300;

/* ---------- 工具 ---------- */
function fmtSize(b){
  if(b == null) return "-";
  if(b < 1024) return b + " B";
  if(b < 1048576) return (b/1024).toFixed(1) + " KB";
  if(b < 1073741824) return (b/1048576).toFixed(1) + " MB";
  return (b/1073741824).toFixed(2) + " GB";
}
function fmtDate(t){
  if(!t) return "-";
  var d = new Date(t * 1000);
  var p = function(n){ return (n<10?"0":"")+n; };
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function escName(n, kw){
  if(!kw) return esc(n);
  var i = n.toLowerCase().indexOf(kw.toLowerCase());
  if(i < 0) return esc(n);
  return esc(n.slice(0,i)) + '<span class="hl">' + esc(n.slice(i, i+kw.length)) + '</span>' + esc(n.slice(i+kw.length));
}
function toastMsg(s){
  toast.textContent = s; toast.style.display = "block";
  clearTimeout(toastMsg._t);
  toastMsg._t = setTimeout(function(){ toast.style.display = "none"; }, 1600);
}

/* ---------- 树节点 ---------- */
function nodeByPath(path){
  var n = DATA;
  for(var i=0;i<path.length;i++){
    var next = null;
    for(var j=0;j<n.f.length;j++){ if(n.f[j].n === path[i]){ next = n.f[j]; break; } }
    if(!next) return null;
    n = next;
  }
  return n;
}
function countSub(node){
  var f = node.l.length, i;
  for(i=0;i<node.f.length;i++) f += countSub(node.f[i]);
  return f;
}
function sizeSub(node){
  var s = 0, i;
  for(i=0;i<node.l.length;i++) s += node.l[i].s;
  for(i=0;i<node.f.length;i++) s += sizeSub(node.f[i]);
  return s;
}
function escPath(p){ return p.map(esc).join(" / "); }

/* ---------- 状态 ---------- */
var state = {
  tab: "browse",
  path: [],            // 当前目录路径
  sort: "name",        // name / size / time
  flat: null,          // 扁平索引 [{path, name, size, time}]
  moreCount: 0
};

/* 默认首页：02【Answer】舆图 / 014中研院数位典藏系统 */
function initPath(){
  if(DATA.f.length === 1){ state.path = [DATA.f[0].n]; }
  if(state.path.length === 1){
    var n = nodeByPath(state.path);
    if(n && n.f.length === 1){ state.path.push(n.f[0].n); }
  }
}

/* ---------- 渲染：面包屑 ---------- */
function renderCrumbs(){
  var html = "";
  if(state.path.length === 0){
    html = '<span class="cur">' + esc(DATA.n) + '</span>';
  } else {
    html = '<span class="link" data-crumb="-1">' + esc(DATA.n) + '</span>';
    for(var i=0;i<state.path.length;i++){
      html += '<span class="sep">›</span>';
      if(i === state.path.length-1) html += '<span class="cur">' + esc(state.path[i]) + '</span>';
      else html += '<span class="link" data-crumb="' + i + '">' + esc(state.path[i]) + '</span>';
    }
  }
  crumbs.innerHTML = html;
}

/* ---------- 渲染：目录页 ---------- */
function renderBrowse(){
  renderCrumbs();
  var node = nodeByPath(state.path);
  if(!node){ main.innerHTML = '<div class="empty">目录不存在</div>'; return; }

  var files = node.l.slice().sort(function(a,b){
    if(state.sort === "size") return b.s - a.s;
    if(state.sort === "time") return b.t - a.t;
    return a.n.localeCompare(b.n, "zh");
  });

  var html = '<div class="stat">' +
    '<span>📁 <b>' + node.f.length + '</b> 个文件夹</span>' +
    '<span>📄 <b>' + files.length + '</b> 个文件</span>' +
    '<span>📦 ' + fmtSize(sizeSub(node)) + '</span>' +
    '</div>';

  // 子文件夹
  node.f.slice().sort(function(a,b){ return a.n.localeCompare(b.n,"zh"); }).forEach(function(sub){
    var c = sub.l.length, sz = 0, i;
    for(i=0;i<sub.l.length;i++) sz += sub.l[i].s;
    for(i=0;i<sub.f.length;i++){ c += countSub(sub.f[i]); sz += sizeSub(sub.f[i]); }
    html += '<div class="folder-card" data-nav="' + esc(sub.n) + '">' +
      '<div class="f-icon">📁</div>' +
      '<div class="f-main"><div class="f-name">' + esc(sub.n) + '</div>' +
      '<div class="f-meta">' + c + ' 项 · ' + fmtSize(sz) + '</div></div>' +
      '<div class="f-arrow">›</div></div>';
  });

  // 文件列表（分批）
  var shown = files.slice(0, state.moreCount > 0 ? state.moreCount : PAGE);
  if(files.length > 0){
    html += '<div class="chips" id="sortchips">' +
      '<span class="chip' + (state.sort==="name"?" on":"") + '" data-sort="name">按名称</span>' +
      '<span class="chip' + (state.sort==="size"?" on":"") + '" data-sort="size">按大小</span>' +
      '<span class="chip' + (state.sort==="time"?" on":"") + '" data-sort="time">按时间</span>' +
      '</div>';
  }
  shown.forEach(function(f){
    html += '<div class="file-row" data-file="' + esc(f.n) + '">' +
      '<div class="f-icon">🖼️</div>' +
      '<div class="f-main"><div class="f-name">' + esc(f.n) + '</div>' +
      '<div class="f-sub">' + fmtSize(f.s) + ' · ' + fmtDate(f.t) + '</div></div></div>';
  });
  if(files.length > shown.length){
    html += '<div class="more tap" id="morebtn">加载更多（还有 ' + (files.length - shown.length) + ' 个）</div>';
  } else if(files.length === 0 && node.f.length === 0){
    html += '<div class="empty">此目录为空</div>';
  }
  main.innerHTML = html;
  bindBrowse();
  setHeaderVar();
}

/* ---------- 渲染：搜索页 ---------- */
function buildFlat(){
  var flat = [];
  (function walk(node, path){
    for(var i=0;i<node.l.length;i++){
      flat.push({ path: path, n: node.l[i].n, s: node.l[i].s, t: node.l[i].t });
    }
    for(var j=0;j<node.f.length;j++){
      walk(node.f[j], path.concat(node.f[j].n));
    }
  })(DATA, []);
  state.flat = flat;
}

function renderSearch(keyword){
  // 搜索框只创建一次，之后只更新结果区，避免输入框重建导致焦点/键盘丢失
  var box = document.getElementById("kw");
  if(!box){
    main.innerHTML = '<div class="search-box"><input id="kw" type="search" placeholder="输入文件名关键词，如：海口、上海、郵政輿圖" autocomplete="off"></div><div id="results"></div>';
    bindSearch();
  }
  var res = document.getElementById("results");
  if(!keyword){
    res.innerHTML = '<div class="empty">输入关键词，在全部 ' + state.flat.length.toLocaleString() + ' 个文件中即时检索</div>';
    return;
  }
  var k = keyword.toLowerCase();
  var hits = [];
  var arr = state.flat;
  for(var i=0;i<arr.length;i++){
    if(arr[i].n.toLowerCase().indexOf(k) >= 0) hits.push(arr[i]);
  }
  var html = '<div class="r-count">找到 <b style="color:var(--main)">' + hits.length + '</b> 个匹配文件</div>';
  var shown = hits.slice(0, 200);
  shown.forEach(function(h){
    html += '<div class="result-item" data-goto="' + esc(h.path.join("\u0001")) + '" data-name="' + esc(h.n) + '">' +
      '<div class="r-name">' + escName(h.n, keyword) + '</div>' +
      '<div class="r-path">' + esc(DATA.n) + ' / ' + esc(h.path.join(" / ")) + '</div>' +
      '<div class="r-meta">' + fmtSize(h.s) + ' · ' + fmtDate(h.t) + '</div></div>';
  });
  if(hits.length > shown.length) html += '<div class="more">仅显示前 200 条，请细化关键词</div>';
  if(hits.length === 0) html += '<div class="empty">没有匹配的文件，换个关键词试试</div>';
  res.innerHTML = html;
}

/* ---------- 事件 ---------- */
function bindBrowse(){
  main.querySelectorAll("[data-nav]").forEach(function(el){
    el.addEventListener("click", function(){
      state.path.push(el.getAttribute("data-nav"));
      state.moreCount = 0;
      renderBrowse();
      window.scrollTo(0,0);
    });
  });
  main.querySelectorAll("[data-file]").forEach(function(el){
    el.addEventListener("click", function(){
      var node = nodeByPath(state.path);
      var name = el.getAttribute("data-file");
      var f = null;
      for(var i=0;i<node.l.length;i++){ if(node.l[i].n === name){ f = node.l[i]; break; } }
      if(!f) return;
      document.getElementById("sh-name").textContent = f.n;
      document.getElementById("sh-size").textContent = fmtSize(f.s);
      document.getElementById("sh-date").textContent = fmtDate(f.t);
      document.getElementById("sh-path").textContent = escPath(state.path.concat(f.n));
      document.getElementById("sh-copy").setAttribute("data-name", f.n);
      sheet.classList.add("show"); mask.style.display = "block";
    });
  });
  var mb = document.getElementById("morebtn");
  if(mb) mb.addEventListener("click", function(){ state.moreCount += PAGE; renderBrowse(); });
  var chips = document.getElementById("sortchips");
  if(chips) chips.addEventListener("click", function(e){
    var c = e.target.closest("[data-sort]");
    if(c){ state.sort = c.getAttribute("data-sort"); renderBrowse(); }
  });
}
function bindSearch(){
  var kw = document.getElementById("kw");
  if(!kw) return;
  var timer = null;
  var composing = false;               // 自己维护输入法组合状态，不依赖 isComposing 兼容性
  kw.addEventListener("compositionstart", function(){ composing = true; });
  kw.addEventListener("compositionend", function(){
    composing = false;
    go();
  });
  kw.addEventListener("input", function(){
    if(composing) return;              // 拼音组合中不搜，选字确认后再搜
    go();
  });
  function go(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      renderSearch(kw.value.trim());
      // 部分移动浏览器 DOM 更新会让输入框失焦、键盘收起，这里强制保持焦点
      if(document.activeElement !== kw){ kw.focus(); }
    }, 300);
  }
  // 结果区用事件委托，重绘后无需重新绑定
  var res = document.getElementById("results");
  if(res) res.addEventListener("click", function(e){
    var el = e.target.closest ? e.target.closest("[data-goto]") : null;
    if(!el) return;
    var path = el.getAttribute("data-goto").split("\u0001");
    var name = el.getAttribute("data-name");
    state.path = path.slice();          // 文件所在文件夹的完整路径
    state.moreCount = 0;
    switchTab("browse");                // 内部已 renderBrowse
    // 高亮目标文件
    var rows = main.querySelectorAll("[data-file]");
    for(var i=0;i<rows.length;i++){
      if(rows[i].getAttribute("data-file") === name){
        rows[i].scrollIntoView({block:"center"});
        rows[i].style.outline = "2px solid var(--accent)";
        rows[i].style.outlineOffset = "-2px";
        setTimeout(function(){ rows[i].style.outline = "none"; }, 1800);
        break;
      }
    }
  });
}

/* ---------- Tab ---------- */
function setHeaderVar(){
  var h = document.querySelector("header");
  if(h) document.documentElement.style.setProperty("--hdh", h.offsetHeight + "px");
}
function switchTab(t){
  closeSheet();                      // 切换时收起详情弹层
  window.scrollTo(0,0);              // 切 Tab 回到顶部，避免保留滚动位置
  setHeaderVar();
  state.tab = t;
  document.getElementById("tab-browse").classList.toggle("on", t==="browse");
  document.getElementById("tab-search").classList.toggle("on", t==="search");
  if(t === "browse") renderBrowse();
  else renderSearch("");
}
document.getElementById("tabbar").addEventListener("click", function(e){
  var b = e.target.closest("button");
  if(b) switchTab(b.getAttribute("data-tab"));
});
crumbs.addEventListener("click", function(e){
  var c = e.target.closest("[data-crumb]");
  if(!c) return;
  var idx = parseInt(c.getAttribute("data-crumb"), 10);
  state.path = state.path.slice(0, idx+1);
  state.moreCount = 0;
  renderBrowse();
});
mask.addEventListener("click", closeSheet);
document.getElementById("sh-copy").addEventListener("click", function(){
  var n = this.getAttribute("data-name");
  var done = function(){ toastMsg("已复制文件名"); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(n).then(done, function(){
      fallbackCopy(n); done();
    });
  } else { fallbackCopy(n); done(); }
});
function fallbackCopy(text){
  var ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}
function closeSheet(){
  sheet.classList.remove("show"); mask.style.display = "none";
}
sheet.addEventListener("click", function(e){ if(e.target === sheet) closeSheet(); });

/* ---------- 启动 ---------- */
initPath();
buildFlat();
renderBrowse();
setHeaderVar();
})();
</script>
